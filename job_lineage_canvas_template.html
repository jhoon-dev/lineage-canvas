<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{color-scheme:light;--ink:#16243b;--muted:#64748b;--line:#dce4ed;--blue:#2563eb;--amber:#b45309}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f7f9fc;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;height:100dvh;display:flex;flex-direction:column}
button,input,select{font:inherit}button,select{cursor:pointer}button,input,select{border:1px solid var(--line);background:white;border-radius:8px;padding:8px 12px;color:var(--ink)}button:hover{background:#eff5ff;border-color:#93b4ee}button:disabled,select:disabled{opacity:.45;cursor:default}:focus-visible{outline:3px solid #93b4ee;outline-offset:3px}
header{background:white;border-bottom:1px solid var(--line);padding:18px 24px 14px;z-index:2}.heading{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:21px;letter-spacing:-.6px;margin:0}h1 span{color:var(--blue)}.sub,small{color:var(--muted);font-size:12px}.sub{margin:3px 0 14px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.searchbox{position:relative;flex:1;min-width:210px;max-width:470px}#search{width:100%;background:#f8fafc}#results{position:absolute;top:44px;width:100%;max-height:340px;overflow:auto;background:white;box-shadow:0 12px 30px #16243b22;border-radius:8px;z-index:5}#results button{display:block;text-align:left;width:100%;border-radius:0;border:0;border-bottom:1px solid var(--line)}#results small{display:block;overflow-wrap:anywhere}.spacer{flex:1}.primary{background:#eaf2ff;border-color:#bad1f8;color:#1d4ed8}
main{display:flex;flex:1;min-height:0}.canvas{position:relative;flex:1;min-width:0;overflow:hidden}#chart{display:block;width:100%;height:100%;touch-action:none;cursor:grab;background-image:radial-gradient(#d6e0ec 1px,transparent 1px);background-size:20px 20px}#chart.panning{cursor:grabbing}.node{cursor:pointer}.node .card{fill:white;stroke:#cbd7e5;stroke-width:1.3;filter:drop-shadow(0 3px 4px #16243b0b)}.node.selected .card{stroke:var(--blue);stroke-width:2.5}.node.cyclic .card{stroke:#d69a43}.node text{font-size:12px;fill:var(--ink)}.node .name{font-size:15px;font-weight:700}.node .meta{font-size:10px;fill:var(--muted)}.node .read{fill:#2563eb;font-size:10px;font-weight:700}.node .write{fill:#047857;font-size:10px;font-weight:700}.node .cycle-badge{fill:var(--amber);font-size:10px;font-weight:700}.node .more{fill:var(--muted);font-size:10px}.link{fill:none;stroke:#97adc8;stroke-width:1.6;marker-end:url(#arrow)}.link.cyclic{stroke:#c48a34;stroke-dasharray:5 4;marker-end:url(#cycleArrow)}.edge-hit{fill:none;stroke:transparent;stroke-width:18;cursor:pointer}.edge-label{cursor:pointer}.edge-label rect{fill:white;stroke:#cbd7e5}.edge-label text{font-size:11px;font-weight:650;fill:#385b84;pointer-events:none}.edge-label.cyclic rect{fill:#fff8ec;stroke:#dfb879}.edge-label:hover rect{fill:#eaf2ff;stroke:var(--blue)}.legend{position:absolute;bottom:18px;left:20px;display:flex;gap:15px;color:var(--muted);font-size:11px;background:#ffffffed;border:1px solid var(--line);padding:8px 12px;border-radius:8px;pointer-events:none}.legend .cycle{color:var(--amber)}.zoom{position:absolute;right:18px;bottom:18px;display:flex;gap:4px}.zoom button{min-width:36px;padding:7px}#empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);pointer-events:none}#empty[hidden]{display:none}aside{width:325px;flex-shrink:0;overflow:auto;border-left:1px solid var(--line);background:white;padding:22px}aside h2{font-size:18px;margin:0 0 4px;overflow-wrap:anywhere}aside h3,dialog h3{font-size:12px;letter-spacing:.04em;margin:22px 0 8px}.id{color:var(--muted);font:12px ui-monospace,monospace;overflow-wrap:anywhere}.hint{color:var(--muted);font-size:13px}.table-list{list-style:none;padding:0;margin:0}.table-list li{padding:7px 0;border-bottom:1px solid #edf1f6;font:12px/1.6 ui-monospace,monospace;overflow-wrap:anywhere}.counts{display:flex;gap:8px;margin:16px 0}.pill{background:#eff5ff;color:#2459a5;padding:4px 8px;border-radius:5px;font-size:11px}.pill.write{background:#eaf8f2;color:#047857}.warning{background:#fff7e9;color:#87520d;border-radius:7px;padding:10px;font-size:12px;margin-top:12px}.neighbors{display:flex;gap:6px;flex-wrap:wrap}.neighbors button{font-size:11px;max-width:100%;overflow-wrap:anywhere;text-align:left}footer{padding:7px 22px;border-top:1px solid var(--line);background:white;font-size:11px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:14px;padding:24px;width:min(600px,92vw);max-height:80vh;color:var(--ink);box-shadow:0 24px 90px #16243b44}dialog::backdrop{background:#16243b66}dialog h2{font-size:18px;margin:0;overflow-wrap:anywhere}.dialog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.dialog-head button{padding:3px 10px;font-size:20px}dialog .table-list{max-height:46vh;overflow:auto}dialog .route{margin:10px 0;color:var(--muted);overflow-wrap:anywhere}
@media(max-width:900px){aside{width:270px;padding:16px}header{padding:14px}.updated{display:none}.legend{max-width:60%;flex-wrap:wrap;gap:4px 10px}}@media(max-width:620px){main{flex-direction:column}aside{width:100%;height:230px;border-left:0;border-top:1px solid var(--line)}.canvas{min-height:260px}.sub{margin-bottom:8px}.toolbar{gap:5px}button,select{padding:7px 9px}.legend{display:none}body{height:auto;min-height:100dvh}main{min-height:600px}#chart{position:absolute;inset:0}}
</style>
</head>
<body>
<header>
  <div class="heading"><h1>LineageCanvas <span>/ Job Lineage</span></h1><small class="updated" id="updated"></small></div>
  <p class="sub">Job의 READ → WRITE 흐름을 탐색합니다. 연결선의 테이블 개수를 누르면 공유 테이블 전체를 볼 수 있습니다.</p>
  <div class="toolbar">
    <div class="searchbox"><input id="search" type="search" placeholder="Job 이름, ID 또는 테이블 검색" aria-label="Job 또는 테이블 검색" aria-controls="results" autocomplete="off"><div id="results" hidden></div></div>
    <label for="scope" class="sub" style="margin:0">탐색 범위</label>
    <select id="scope" aria-label="탐색 범위" disabled><option value="all">전체 Job</option><option value="upstream">선행 Job</option><option value="downstream">후행 Job</option><option value="both">선행 + 후행</option></select>
    <button id="all">전체 보기</button><button id="fit">화면 맞춤</button>
    <span class="spacer"></span><button id="diagnostics">순환 / 다중 생성</button><button id="export" class="primary">CSV 내보내기</button>
  </div>
</header>
<main>
  <section class="canvas" aria-label="Job 의존성 그래프">
    <svg id="chart" aria-label="Job Lineage 캔버스"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#97adc8"/></marker><marker id="cycleArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#c48a34"/></marker></defs><g id="viewport"></g></svg>
    <div id="empty" hidden>표시할 Job이 없습니다.</div>
    <div class="legend"><span>→ WRITE → READ</span><span class="cycle">┄ 순환 의존성</span><span>노드 클릭 · 드래그 이동 · 휠 확대</span></div>
    <div class="zoom"><button id="minus" aria-label="축소">−</button><button id="plus" aria-label="확대">+</button></div>
  </section>
  <aside id="details" aria-label="선택한 Job 상세"><h2>Job을 선택하세요</h2><p class="hint">각 노드에서 READ / WRITE 테이블을 확인하고, 선택한 Job의 전체 목록과 선후행 Job을 탐색하세요.</p></aside>
</main>
<footer id="status" role="status"></footer>
<dialog id="table-dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="닫기">×</button></div><div id="dialog-body"></div></dialog>
<script>
'use strict';
const PAYLOAD = __PAYLOAD__;
const DATA = PAYLOAD.data;
const jobs = new Map(DATA.jobs.map(job => [job.id, job]));
const svg = document.getElementById('chart'), viewport = document.getElementById('viewport');
const details = document.getElementById('details'), scope = document.getElementById('scope');
const search = document.getElementById('search'), results = document.getElementById('results');
const dialog = document.getElementById('table-dialog');
const W = 350, H = 190, COL = 550, ROW = 235;
let selected = PAYLOAD.initial_job || null, visible = new Set(jobs.keys());
let view = {x:40,y:40,scale:1}, drag = null, suppressClick = false;
const position = job => ({x:job.level * COL, y:job.row * ROW});
const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shorten = (s,n=22) => {let width=0,result='';for(const c of s){width+=c.codePointAt(0)>255?2:1;if(width>n-1)return result+'…';result+=c}return result};
const listHTML = items => items.length ? '<ul class="table-list">'+items.map(t=>`<li>${escape(t)}</li>`).join('')+'</ul>' : '<p class="hint">없음</p>';

function applyView(){viewport.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.scale})`)}
function fit(){
  if(!visible.size)return;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const id of visible){const p=position(jobs.get(id));minX=Math.min(minX,p.x-100);minY=Math.min(minY,p.y-30);maxX=Math.max(maxX,p.x+W+100);maxY=Math.max(maxY,p.y+H+30)}
  const r=svg.getBoundingClientRect();
  view.scale=Math.max(.03,Math.min(1,(r.width-60)/(maxX-minX),(r.height-70)/(maxY-minY)));
  view.x=(r.width-(maxX-minX)*view.scale)/2-minX*view.scale;
  view.y=(r.height-(maxY-minY)*view.scale)/2-minY*view.scale;applyView();
}
function zoom(factor,x=svg.clientWidth/2,y=svg.clientHeight/2){
  const scale=Math.max(.03,Math.min(2.5,view.scale*factor));
  view.x=x-(x-view.x)*scale/view.scale;view.y=y-(y-view.y)*scale/view.scale;view.scale=scale;applyView();
}
function collect(id,direction){
  const found=new Set([id]),queue=[id];
  for(let i=0;i<queue.length;i++)for(const next of jobs.get(queue[i])[direction])if(!found.has(next)){found.add(next);queue.push(next)}
  return found;
}
function updateVisible(){
  visible=new Set(jobs.keys());
  if(selected && scope.value!=='all'){
    visible=new Set([selected]);
    if(scope.value==='upstream'||scope.value==='both')for(const id of collect(selected,'parents'))visible.add(id);
    if(scope.value==='downstream'||scope.value==='both')for(const id of collect(selected,'children'))visible.add(id);
  }
  render();
}
function selectJob(id,center=false){
  if(!jobs.has(id))return;
  selected=id;scope.disabled=false;results.hidden=true;updateVisible();renderDetails();
  if(center){const p=position(jobs.get(id));view.scale=1;view.x=svg.clientWidth/2-p.x-W/2;view.y=svg.clientHeight/2-p.y-H/2;applyView()}
}
function renderDetails(){
  if(!selected)return;
  const j=jobs.get(selected);
  const neighbors=(ids)=>ids.length?'<div class="neighbors">'+ids.map(id=>`<button data-job="${escape(id)}">${escape(jobs.get(id).name)}</button>`).join('')+'</div>':'<p class="hint">없음</p>';
  details.innerHTML=`<h2>${escape(j.name)}</h2><div class="id">${escape(j.id)}</div><div class="counts"><span class="pill">READ ${j.read_tables.length}</span><span class="pill write">WRITE ${j.write_tables.length}</span></div>`+
    (j.cyclic?'<div class="warning">순환 의존성에 포함된 Job입니다. 점선으로 표시된 연결을 확인하세요.</div>':'')+
    (j.in_place_tables.length?`<div class="warning">동일 테이블 READ / WRITE ${j.in_place_tables.length}개 (자기 연결 제외)${listHTML(j.in_place_tables)}</div>`:'')+
    `<h3>READ · ${j.read_tables.length}</h3>${listHTML(j.read_tables)}<h3>WRITE · ${j.write_tables.length}</h3>${listHTML(j.write_tables)}<h3>선행 Job · ${j.parents.length}</h3>${neighbors(j.parents)}<h3>후행 Job · ${j.children.length}</h3>${neighbors(j.children)}`;
  details.querySelectorAll('[data-job]').forEach(b=>b.addEventListener('click',()=>selectJob(b.dataset.job,true)));
}
function nodeHTML(j){
  const p=position(j);
  function tables(items,x){return (items.length?items.slice(0,3):['없음']).map((t,i)=>`<text x="${x}" y="${102+i*20}"><title>${escape(t)}</title>${escape(shorten(t,21))}</text>`).join('')+(items.length>3?`<text class="more" x="${x}" y="164">+${items.length-3}개 · 클릭하여 전체 보기</text>`:'')}
  return `<g class="node${selected===j.id?' selected':''}${j.cyclic?' cyclic':''}" data-job="${escape(j.id)}" transform="translate(${p.x},${p.y})" tabindex="0" role="button" aria-label="${escape(j.name)}, ${escape(j.id)}, READ ${j.read_tables.length}, WRITE ${j.write_tables.length}"><title>${escape(j.name)} (${escape(j.id)})</title><rect class="card" width="${W}" height="${H}" rx="12"/><text class="name" x="16" y="27">${escape(shorten(j.name,31))}</text><text class="meta" x="16" y="47">${escape(shorten(j.id,38))}</text>${j.cyclic?'<text class="cycle-badge" x="310" y="47">순환</text>':''}<path d="M0 61 H350 M175 61 V176" stroke="#e5ebf3"/><text class="read" x="16" y="82">READ · ${j.read_tables.length}</text><text class="write" x="190" y="82">WRITE · ${j.write_tables.length}</text>${tables(j.read_tables,16)}${tables(j.write_tables,190)}</g>`;
}
function edgePath(e){
  const s=position(jobs.get(e.source)),t=position(jobs.get(e.target));
  if(t.x>s.x){const x1=s.x+W,y1=s.y+H/2,x2=t.x,y2=t.y+H/2,mid=(x1+x2)/2;return `M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`}
  const down=t.y>s.y,port=down?W:0,x1=s.x+port,x2=t.x+port,y1=s.y+H/2,y2=t.y+H/2;
  const lane=down?Math.max(x1,x2)+120:Math.min(x1,x2)-120;
  return `M${x1},${y1} C${lane},${y1} ${lane},${y2} ${x2},${y2}`;
}
function activate(element,fn){
  element.addEventListener('click',ev=>{ev.stopPropagation();if(!suppressClick)fn()});
  element.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'||ev.key===' '){
      ev.preventDefault();fn();
      // Rendering replaces SVG nodes; keep the keyboard focus on the new node.
      if(element.dataset.job){const replacement=[...viewport.querySelectorAll('.node')].find(node=>node.dataset.job===element.dataset.job);if(replacement)replacement.focus({preventScroll:true})}
    }
  });
}
function showDialog(title,body){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').innerHTML=body;dialog.showModal()}
function showEdge(index){
  const e=DATA.edges[index];
  showDialog(`${e.table_count} ${e.table_count===1?'Table':'Tables'}`,`<p class="route">${escape(jobs.get(e.source).name)} (${escape(e.source)}) → ${escape(jobs.get(e.target).name)} (${escape(e.target)})</p><p class="hint">앞 Job이 WRITE하고 뒤 Job이 READ하는 공유 테이블</p>${listHTML(e.tables)}`);
}
function render(){
  const edges=DATA.edges.map((e,index)=>({e,index})).filter(({e})=>visible.has(e.source)&&visible.has(e.target));
  viewport.innerHTML=edges.map(({e,index})=>`<path id="edge-${index}" class="link${e.cyclic?' cyclic':''}" d="${edgePath(e)}"/><path class="edge-hit" data-edge="${index}" d="${edgePath(e)}"/>`).join('')+
    [...visible].map(id=>nodeHTML(jobs.get(id))).join('')+'<g id="labels"></g>';
  const boxes=[...visible].map(id=>{const p=position(jobs.get(id));return {x:p.x-4,y:p.y-4,w:W+8,h:H+8}});
  const labels=document.getElementById('labels');
  for(const {e,index} of edges){
    const path=document.getElementById(`edge-${index}`),length=path.getTotalLength();
    const label=`${e.table_count} ${e.table_count===1?'Table':'Tables'}`,width=24+label.length*6.5;
    let point;
    for(const ratio of [.5,.4,.6,.3,.7,.2,.8]){
      point=path.getPointAtLength(length*ratio);
      if(!boxes.some(b=>point.x+width/2>b.x&&point.x-width/2<b.x+b.w&&point.y+13>b.y&&point.y-13<b.y+b.h))break;
    }
    boxes.push({x:point.x-width/2,y:point.y-13,w:width,h:26});
    labels.insertAdjacentHTML('beforeend',`<g class="edge-label${e.cyclic?' cyclic':''}" data-edge="${index}" transform="translate(${point.x},${point.y})" tabindex="0" role="button" aria-label="${escape(jobs.get(e.source).name)} → ${escape(jobs.get(e.target).name)}: ${label}"><rect x="${-width/2}" y="-12" width="${width}" height="24" rx="7"/><text text-anchor="middle" y="4">${label}</text></g>`);
  }
  viewport.querySelectorAll('.node').forEach(el=>activate(el,()=>selectJob(el.dataset.job)));
  viewport.querySelectorAll('[data-edge]').forEach(el=>activate(el,()=>showEdge(Number(el.dataset.edge))));
  document.getElementById('empty').hidden=visible.size>0;
  document.getElementById('status').textContent=`${visible.size} / ${jobs.size} Jobs · ${edges.length} / ${DATA.edges.length} Connections · ${DATA.mapping_count} READ/WRITE 관계 · 순환 ${DATA.cycles.length}그룹 · 다중 생성 ${DATA.multi_writer_tables.length}테이블`;
  applyView();
}
search.addEventListener('input',()=>{
  const q=search.value.trim().toLocaleLowerCase();results.hidden=!q;if(!q){results.innerHTML='';return}
  const matches=DATA.jobs.filter(j=>[j.id,j.name,...j.read_tables,...j.write_tables].some(t=>t.toLocaleLowerCase().includes(q))).slice(0,30);
  results.innerHTML=matches.length?matches.map(j=>`<button data-job="${escape(j.id)}">${escape(j.name)}<small>${escape(j.id)} · READ ${j.read_tables.length} / WRITE ${j.write_tables.length}</small></button>`).join(''):'<p class="hint" style="padding:12px">검색 결과가 없습니다.</p>';
  results.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>selectJob(b.dataset.job,true)));
});
search.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=results.querySelector('button');if(!results.hidden&&b)b.click()}if(e.key==='Escape')results.hidden=true});
document.addEventListener('click',e=>{if(!e.target.closest('.searchbox'))results.hidden=true});
scope.addEventListener('change',()=>{updateVisible();fit()});
document.getElementById('fit').addEventListener('click',fit);
document.getElementById('all').addEventListener('click',()=>{scope.value='all';search.value='';results.hidden=true;updateVisible();fit()});
document.getElementById('plus').addEventListener('click',()=>zoom(1.2));document.getElementById('minus').addEventListener('click',()=>zoom(1/1.2));
document.getElementById('close-dialog').addEventListener('click',()=>dialog.close());
document.getElementById('diagnostics').addEventListener('click',()=>{
  const cycles=DATA.cycles.length?DATA.cycles.map((group,i)=>`<h3>순환 그룹 ${i+1}</h3>${listHTML(group.map(id=>jobs.get(id).name+' ('+id+')'))}`).join(''):'<p class="hint">순환 의존성이 없습니다.</p>';
  const multi=DATA.multi_writer_tables.length?DATA.multi_writer_tables.map(item=>`<h3>${escape(item.table)}</h3>${listHTML(item.job_ids.map(id=>jobs.get(id).name+' ('+id+')'))}`).join(''):'<p class="hint">다중 생성 테이블이 없습니다.</p>';
  showDialog('순환 의존성 / 다중 생성 테이블',`<p class="hint">순환 ${DATA.cycles.length}그룹 · 다중 생성 ${DATA.multi_writer_tables.length}테이블</p>${cycles}<h3>다중 생성 테이블</h3><p class="hint">생성 Job이 여러 개이면 각 생성 Job → 읽는 Job으로 연결합니다. 실행 순서는 입력 데이터로 판단할 수 없습니다.</p>${multi}`);
});
document.getElementById('export').addEventListener('click',()=>{
  const cell=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[['job_id','job_name','table_name','relation_type']];
  for(const id of visible){const j=jobs.get(id);for(const [type,tables] of [['READ',j.read_tables],['WRITE',j.write_tables]])for(const t of tables)rows.push([id,j.name,t,type])}
  const url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(row=>row.map(cell).join(',')).join('\r\n')+'\r\n'],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='job_table_mapping.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
});
svg.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.node,.edge-label,.edge-hit'))return;drag={x:e.clientX,y:e.clientY,viewX:view.x,viewY:view.y};suppressClick=false;svg.setPointerCapture(e.pointerId);svg.classList.add('panning')});
svg.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)suppressClick=true;view.x=drag.viewX+dx;view.y=drag.viewY+dy;applyView()});
function endDrag(){drag=null;svg.classList.remove('panning');setTimeout(()=>suppressClick=false,0)}
svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});
new ResizeObserver(()=>fit()).observe(svg);
document.getElementById('updated').textContent='Updated '+PAYLOAD.data_updated_at;
document.getElementById('diagnostics').textContent=`순환 ${DATA.cycles.length} / 다중 생성 ${DATA.multi_writer_tables.length}`;
render();if(selected){scope.disabled=false;renderDetails()}requestAnimationFrame(fit);
</script>
</body>
</html>
